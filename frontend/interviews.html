<!DOCTYPE html>
<html>
<head>
    <title>Interviews - Interview Pilot</title>
</head>

<body>

    <h1>Interview Schedule</h1>

    <h2>Add Interview</h2>

    <form action="/add-interview" method="POST">

        <input
            type="text"
            name="company"
            placeholder="Company"
            required
        >

        <br><br>

        <input
            type="date"
            name="date"
            required
        >

        <br><br>

        <input
            type="text"
            name="round"
            placeholder="Round"
            required
        >

        <br><br>

        <button type="submit">
            Add Interview
        </button>

    </form>

    <hr>

    <h2>Upcoming Interviews</h2>

    <div id="interviewList">
        Loading interviews...
    </div>

    <br>

    <a href="/dashboard.html">
        Back to Dashboard
    </a>

    <script>

        async function loadInterviews() {

            try {

                const response = await fetch("/interviews");

                const interviews = await response.json();

                const list = document.getElementById("interviewList");

                if (interviews.length === 0) {

                    list.innerHTML = "No interviews added yet.";

                    return;
                }

                list.innerHTML = "";

                interviews.forEach(interview => {

                    const div = document.createElement("div");

                    const date = new Date(interview.date)
                        .toLocaleDateString();

                    div.innerHTML = `
                        <p>
                            <strong>${interview.company}</strong>
                            <br>
                            Date: ${date}
                            <br>
                            Round: ${interview.round}
                        </p>

                        <hr>
                    `;

                    list.appendChild(div);

                });

            } catch (error) {

                console.log(error);

                document.getElementById("interviewList").innerHTML =
                    "Failed to load interviews.";

            }
        }

        loadInterviews();

    </script>

</body>
</html>
