<div class="container">

    <h1>My Interviews</h1>

    <p>
        Add your upcoming campus placement interviews.
    </p>

    <br>


    <h2>Add Interview</h2>

    <br>

    <form action="/add-interview" method="POST">

        <label>Company</label>
        <input
            type="text"
            name="company"
            placeholder="e.g. TCS"
            required
        >

        <br>

        <label>Interview Date</label>
        <input
            type="date"
            name="date"
            required
        >

        <br>

        <label>Round</label>
        <input
            type="text"
            name="round"
            placeholder="e.g. Technical"
            required
        >

        <br><br>

        <button type="submit">
            Add Interview
        </button>

    </form>


    <br><br>


    <h2>Upcoming Interviews</h2>

    <br>

    <p>No interviews added yet.</p>

    <br>

    <a href="dashboard.html">
        Back to Dashboard
    </a>

</div>
