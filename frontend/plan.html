<!DOCTYPE html>
<html>
<head>
    <title>Preparation Plan - Interview Pilot</title>
</head>

<body>

    <h1>Preparation Plan</h1>

    <div id="planContainer">
        Loading preparation plan...
    </div>

    <br>

    <a href="/dashboard.html">
        Back to Dashboard
    </a>

    <script>

        async function loadPlan() {

            try {

                const response = await fetch("/plan");

                const plan = await response.json();

                const container =
                    document.getElementById("planContainer");

                if (!plan) {

                    container.innerHTML =
                        "No preparation plan found.";

                    return;
                }

                container.innerHTML = `
                    <h2>${plan.company}</h2>

                    <p>
                        <strong>Generated:</strong>
                        ${new Date(plan.generatedDate).toLocaleDateString()}
                    </p>

                    <pre>${plan.plan}</pre>
                `;

            } catch (error) {

                console.log(error);

                document.getElementById("planContainer").innerHTML =
                    "Failed to load preparation plan.";

            }
        }

        loadPlan();

    </script>

</body>
</html>
